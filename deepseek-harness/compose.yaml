x-titanos:
  icon: "https://raw.githubusercontent.com/deepseek-ai/deepseek-harness/master/apps/desktop/resources/icon.png"
  name: DeepSeek Harness
  main: dsh
  category: productivity

  description:
    de: >-
      KI-Agent von DeepSeek mit Web-Oberfläche: liest und bearbeitet
      Dateien in einem Arbeitsordner, führt Befehle aus und plant Aufgaben.
      Erweiterbar über Plugins. Entwicklervorschau.
    en: >-
      AI agent by DeepSeek with a web interface: reads and edits files in a
      workspace folder, runs commands and plans tasks. Extensible through
      plugins. Developer preview.

  tips:
    de: >-
      Es gibt kein offizielles Docker-Image. Der Container startet das
      npm-Paket @deepseek-ai/dsh in der angegebenen Version; der erste Start
      lädt es herunter und dauert etwas länger.
      Anmelden: Unter Docker die Logs der App öffnen und die Zeile
      „dsh web:“ suchen. Die Adresse dort enthält einen Zugangsschlüssel, der
      bei jedem Start neu entsteht; sie einmal öffnen, danach genügt der
      Web-UI-Knopf. Steht im Log ein anderer Port als in TitanOS, den Port in
      der Adresse anpassen.
      Unter „Adresse des NAS“ den Namen oder die IP eintragen, mit der der
      Browser das NAS erreicht; andere Adressen lehnt DeepSeek Harness ab.
      Danach in der Oberfläche unter Settings → Models einen API-Schlüssel
      eintragen und /workspace als Arbeitsordner wählen.
      Der Agent führt von einem KI-Modell erzeugte Befehle aus. Er sieht nur
      seinen Datenordner und den Arbeitsordner, beides mit den Rechten des
      installierenden Kontos, hat aber Internetzugang. Nur Ordner freigeben,
      deren Inhalt er verändern darf, und Backups haben.
      Die Verbindung ist unverschlüsseltes HTTP. Nur im Heimnetz oder über VPN
      (Tailscale) nutzen, nicht ins Internet freigeben.
    en: >-
      There is no official Docker image. The container starts the npm package
      @deepseek-ai/dsh in the chosen version; the first start downloads it and
      takes a little longer.
      Signing in: open the app's logs under Docker and find the line
      "dsh web:". Its address carries an access token that changes on every
      start; open it once, after that the Web UI button is enough. If the log
      shows a different port than TitanOS, adjust the port in the address.
      Under "NAS address", enter the name or IP your browser uses to reach the
      NAS; DeepSeek Harness rejects other addresses.
      Then add an API key under Settings → Models and choose /workspace as the
      workspace.
      The agent runs commands generated by an AI model. It only sees its data
      folder and the workspace folder, both with the rights of the installing
      account, but it has internet access. Only share folders it may change,
      and keep backups.
      The connection is plain HTTP. Use it only on your home network or over
      a VPN (Tailscale); do not expose it to the internet.

  variables:
    DSH_NAS_HOST:
      label:
        de: Adresse des NAS (Name oder IP, ohne Port)
        en: NAS address (name or IP, without port)
      help:
        de: Wie im Browser, zum Beispiel titanos.local oder 192.168.1.20.
        en: As typed in the browser, for example titanos.local or 192.168.1.20.
      placeholder: titanos.local
      required: true
    DSH_VERSION:
      label:
        de: Version von DeepSeek Harness
        en: DeepSeek Harness version
      help:
        de: >-
          Entwicklervorschau mit inkompatiblen Änderungen. Eine neue Version
          hier eintragen und die App neu erstellen.
        en: >-
          Developer preview with breaking changes. Enter a newer version here
          and recreate the app.
      required: true
    PUID:
      label:
        de: Benutzer-ID
        en: User ID
    PGID:
      label:
        de: Gruppen-ID
        en: Group ID

  paths:
    /data:
      label:
        de: Einstellungen, Sitzungen und npm-Zwischenspeicher
        en: Settings, sessions and npm cache
    /workspace:
      label:
        de: Arbeitsordner des Agenten
        en: Agent workspace
      suggest: share

  ports:
    "3080":
      label: DeepSeek Harness
      webui: true

services:
  dsh:
    labels:
      titanos.webui: "http://[host]:3080"
    image: "node:24-bookworm-slim"
    restart: unless-stopped
    environment:
      TZ: ""
      PUID: ""
      PGID: ""
      DSH_NAS_HOST: ""
      DSH_VERSION: "0.2.1-rc.2"
      HOME: /data
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    working_dir: /workspace
    # DeepSeek Harness only binds one concrete address, never 0.0.0.0, and
    # only accepts browsers that name the listener or a trusted host.
    # The process drops to the installing account before anything runs.
    command:
      - sh
      - -c
      - >-
        umask 0002;
        exec setpriv --reuid="$${PUID:?}" --regid="$${PGID:?}" --clear-groups
        npx --yes "@deepseek-ai/dsh@$${DSH_VERSION:?}" --profile web --no-open
        --host "$$(hostname -i | awk '{print $$1}')" --port 3080
        --trusted-host "$${DSH_NAS_HOST:?}"
        --public-url "http://$${DSH_NAS_HOST}:3080/"
    ports:
      - "3080:3080"
    volumes:
      - ./data:/data
      - ./workspace:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
