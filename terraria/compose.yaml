x-titanos:
  name: Terraria / tModLoader
  main: terraria
  category: games
  description:
    de: Terraria-Server mit tModLoader, dauerhafter Welt und optionalen Workshop-Mods.
    en: Terraria server with tModLoader, a persistent world and optional Workshop mods.
  tips:
    de: Gameserver für passende tModLoader-Clients (Terraria 1.4.4). Drittanbieter-Container von Crosis47 mit
      vollständigen .NET-Laufzeitbibliotheken. Das optionale Web-Dashboard ist deaktiviert; Einstellungen
      im TitanOS-Formular festlegen. Ohne Workshop-Mod-IDs startet die Vorlage ohne zusätzliche Mods.
      Weltname und Größe gelten bei erster Erzeugung. NAS-Port 7778 vermeidet den Standardkonflikt mit
      Satisfactory. Beim ersten Start werden tModLoader und .NET auf das Daten-Volume geladen; spätere
      automatische Spielupdates sind ausgeschaltet. Welt, Mods, Laufzeit und Einstellungen liegen in
      /data. Manuelle Backups können über tmod-backup backup in der Containerkonsole angelegt werden. Vor
      Versionswechseln die Welt sichern; keine automatische Routerfreigabe.
    en: Game server for matching tModLoader clients (Terraria 1.4.4). Third-party container by Crosis47 with
      complete .NET runtime dependencies. The optional web dashboard is disabled; configure settings in
      the TitanOS form. Without Workshop mod IDs the template starts without additional mods. World name
      and size apply on first generation. NAS port 7778 avoids the default conflict with Satisfactory.
      The first start downloads tModLoader and .NET to the data volume; later automatic game updates are
      disabled. World, mods, runtime and configuration reside in /data. Create manual backups with
      tmod-backup backup in the container console. Back up worlds before version changes; no automatic
      router forwarding.
  variables:
    TMOD_MOTD:
      label:
        de: Serverbeschreibung
        en: Server description
    TMOD_PASS:
      label:
        de: Serverpasswort
        en: Server password
      secret: generate
      required: true
    TMOD_MAXPLAYERS:
      label:
        de: Spielerlimit
        en: Player limit
    TMOD_WORLDNAME:
      label:
        de: Weltname
        en: World name
    TMOD_WORLDSIZE:
      label:
        de: Weltgröße (1 klein, 2 mittel, 3 groß)
        en: World size (1 small, 2 medium, 3 large)
    TMOD_DIFFICULTY:
      label:
        de: Schwierigkeit (0 normal, 1 Experte, 2 Meister)
        en: Difficulty (0 normal, 1 expert, 2 master)
    TZ:
      label:
        de: Zeitzone
        en: Timezone
      fill: timezone
    TMOD_MODS:
      label:
        de: Workshop-Mod-IDs (optional)
        en: Workshop mod IDs (optional)
  paths:
    /data:
      label:
        de: Welt, Mods und Serverdateien
        en: World, mods and server files
    /backups:
      label:
        de: Manuelle Welt-Backups
        en: Manual world backups
  ports:
    "7777":
      label: Terraria / tModLoader (TCP)
      webui: false
  icon: https://raw.githubusercontent.com/tModLoader/tModLoader/stable/solutions/documentation/tModLoaderIcon-Small.png
services:
  terraria:
    image: ghcr.io/crosis47/tmodloader:latest
    restart: unless-stopped
    environment:
      TMOD_MOTD: TitanOS Terraria
      TMOD_PASS: ""
      TMOD_MAXPLAYERS: "8"
      TMOD_WORLDNAME: TitanOS
      TMOD_WORLDSIZE: "1"
      TMOD_DIFFICULTY: "0"
      TMOD_AUTOSAVE_INTERVAL: "10"
      TMOD_SHUTDOWN_MESSAGE: Server shutting down
      TZ: ""
      TMOD_WEB_ENABLED: "0"
      TMOD_AUTO_UPDATE: "0"
      TMOD_MODS: ""
      TMOD_UPNP: "0"
    ports:
      - 7778:7777/tcp
    volumes:
      - ./data:/data
      - ./backups:/backups
    stdin_open: true
    tty: true
    stop_grace_period: 2m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
