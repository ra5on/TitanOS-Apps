services:
  mariadb:
    image: "mariadb:${MARIADB_VERSION:-11.8}"
    environment:
      MARIADB_VERSION: "11.8"
      MYSQL_DATABASE: "nextcloud"
      MYSQL_USER: "nextcloud"
      MYSQL_PASSWORD: ""
      MARIADB_ROOT_PASSWORD: ""

  nextcloud:
    image: "nextcloud:${NEXTCLOUD_VERSION:-35.0.2-apache}"
    environment:
      NEXTCLOUD_VERSION: "35.0.2-apache"
      NEXTCLOUD_ADMIN_USER: ""
      NEXTCLOUD_ADMIN_PASSWORD: ""
      MYSQL_HOST: "mariadb"
      MYSQL_DATABASE: "nextcloud"
      MYSQL_USER: "nextcloud"
      MYSQL_PASSWORD: ""

  nextcloud-cron:
    image: "nextcloud:${NEXTCLOUD_VERSION:-35.0.2-apache}"
