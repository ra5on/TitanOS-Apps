x-titanos:
  icon: "https://raw.githubusercontent.com/syncthing/syncthing/main/assets/logo-128.png"
  name: Syncthing
  category: backup
  description:
    de: Ordner zwischen Geräten synchronisieren, ohne Cloud.
    en: Keep folders in sync between devices, without a cloud.
  paths:
    /var/syncthing:
      label: { de: Konfiguration, en: Configuration }
    /data:
      label: { de: Synchronisierte Ordner, en: Synced folders }
      suggest: share
  ports:
    "8384":
      label: WebUI
      webui: true
    "22000":
      label: { de: Synchronisation, en: Sync }
    "22000/udp":
      label: { de: Synchronisation (QUIC), en: Sync (QUIC) }
    "21027/udp":
      label: { de: Geräte im Netz finden, en: Local discovery }

services:
  # Docker legt ./data als root an; Syncthing läuft als PUID und könnte dort
  # keinen Ordner anlegen. Nur ein frischer, leerer Ordner von root bekommt
  # den Besitzer – eine gewählte Freigabe bleibt, wie sie ist.
  init:
    image: syncthing/syncthing:latest
    user: "0:0"
    restart: "no"
    environment:
      PUID: ""
      PGID: ""
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - >-
        if [ "$$(stat -c %u /data)" = 0 ] && [ -z "$$(ls -A /data)" ];
        then chown "$${PUID:?}:$${PGID:?}" /data; fi
    volumes:
      - "./data:/data"
    security_opt:
      - no-new-privileges=true

  syncthing:
    depends_on:
      init:
        condition: service_completed_successfully
    labels:
      titanos.webui: "http://[host]:8384"
    image: syncthing/syncthing:latest
    restart: unless-stopped
    environment:
      PUID: ""
      PGID: ""
      TZ: ""
    volumes:
      - "./config:/var/syncthing"
      - "./data:/data"
    ports:
      - "8384:8384"
      - "22000:22000"
      - "22000:22000/udp"
      - "21027:21027/udp"
