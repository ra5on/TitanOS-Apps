x-titanos:
  name: Trilium Notes
  main: trilium
  category: productivity
  description:
    de: Persönliche Wissensdatenbank mit hierarchischen Notizen, Anhängen und Browsereditor.
    en: Personal knowledge base with hierarchical notes, attachments and a browser editor.
  tips:
    de: >-
      Beim ersten Öffnen eine Wissensdatenbank erstellen oder synchronisieren und ein eigenes
      Passwort setzen. Trilium ist eine Einzelbenutzer-Anwendung; für mehrere Personen getrennte
      Installationen mit eigenen Datenordnern und Ports verwenden. Die TitanOS-Anmeldung wird nicht
      übernommen. Notizen, Anhänge, Konfiguration und Trilium-Backups liegen im Datenordner auf dem
      Volume; diesen regelmäßig zusätzlich sichern. Für Desktop-Synchronisation passende
      Trilium-Versionen verwenden. Für Fernzugriff HTTPS am Reverse-Proxy separat einrichten.
    en: >-
      On first opening, create or synchronize a knowledge base and set your own password.
      Trilium is a single-user application; use separate installations with separate data folders
      and ports for multiple people. TitanOS authentication is separate. Notes, attachments,
      configuration and Trilium backups reside in the data folder on the volume; back it up
      separately and regularly. Use compatible Trilium versions for desktop synchronization.
      Configure HTTPS separately at a reverse proxy for remote access.
  variables:
    USER_UID:
      label:
        de: Benutzer-ID für Daten
        en: Data user ID
      fill: uid
    USER_GID:
      label:
        de: Gruppen-ID für Daten
        en: Data group ID
      fill: gid
    TZ:
      label:
        de: Zeitzone
        en: Timezone
      fill: timezone
  paths:
    /home/node/trilium-data:
      label:
        de: Notizen, Konfiguration und Backups
        en: Notes, configuration and backups
  ports:
    "8080":
      label: WebUI / Sync
      webui: true
  icon: https://raw.githubusercontent.com/TriliumNext/Trilium/v0.106.1/apps/client/src/assets/icon-color.svg
services:
  trilium:
    image: triliumnext/trilium:v0.106.1
    restart: unless-stopped
    labels:
      titanos.webui: http://[host]:8080
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      TZ: ""
    ports:
      - "8080:8080"
    volumes:
      - ./data:/home/node/trilium-data
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
