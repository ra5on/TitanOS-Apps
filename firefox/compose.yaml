x-titanos:
  icon: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/svg/firefox.svg
  name: Firefox
  main: firefox
  category: network
  description:
    de: Firefox auf dem NAS mit geschütztem Browserzugang und dauerhaftem Profil.
    en: Firefox on your NAS with authenticated browser access and a persistent profile.
  tips:
    de: Drittanbieter-Container von jlesage. WebUI über HTTPS öffnen und mit dem hier gewählten Benutzernamen
      und Passwort anmelden. Ein selbstsigniertes Zertifikat wird beim ersten Start erzeugt. Alle
      Besucher dieser Instanz teilen dasselbe Firefox-Profil einschließlich Cookies und gespeicherter
      Anmeldungen. Für jede Person eine eigene Installation mit eigenen Datenordnern und eigenem Port
      verwenden. Profil und Downloads liegen auf dem Daten-Volume. Dateien sind im Browser unter /storage
      verfügbar. Die TitanOS-Anmeldung wird nicht übernommen.
    en: Third-party container by jlesage. Open the WebUI over HTTPS and sign in with the chosen username and
      password. A self-signed certificate is generated on first startup. All visitors to this instance
      share one Firefox profile, including cookies and saved logins. Use a separate installation with
      separate data folders and port for each person. The profile and downloads reside on the data
      volume. Files are available inside Firefox under /storage. TitanOS authentication is separate.
  variables:
    WEB_AUTHENTICATION_USERNAME:
      label:
        de: Benutzername für den Browserzugang
        en: Browser access username
      required: true
    WEB_AUTHENTICATION_PASSWORD:
      label:
        de: Passwort für den Browserzugang
        en: Browser access password
      help:
        de: Erzeugtes Passwort für die Anmeldung an der Firefox-WebUI aufbewahren.
        en: Keep the generated password for signing in to the Firefox WebUI.
      secret: generate
      required: true
    USER_ID:
      label:
        de: Benutzer-ID
        en: User ID
      fill: uid
    GROUP_ID:
      label:
        de: Gruppen-ID
        en: Group ID
      fill: gid
    TZ:
      label:
        de: Zeitzone
        en: Timezone
      fill: timezone
    LANG:
      label:
        de: Anwendungssprache
        en: Application language
      help:
        de: Zum Beispiel de_DE.UTF-8 oder en_US.UTF-8; verfügbare Übersetzungen hängen vom Image ab.
        en: For example de_DE.UTF-8 or en_US.UTF-8; available translations depend on the image.
  paths:
    /config:
      label:
        de: Firefox-Profil und Einstellungen
        en: Firefox profile and settings
    /storage:
      label:
        de: Downloads und übertragene Dateien
        en: Downloads and transferred files
  ports:
    "5800":
      label: WebUI (HTTPS)
      webui: true
services:
  firefox:
    image: jlesage/firefox:latest
    restart: unless-stopped
    labels:
      titanos.webui: https://[host]:5801
    environment:
      USER_ID: ""
      GROUP_ID: ""
      TZ: ""
      LANG: de_DE.UTF-8
      UMASK: "0077"
      SECURE_CONNECTION: "1"
      WEB_AUTHENTICATION: "1"
      WEB_AUTHENTICATION_USERNAME: ""
      WEB_AUTHENTICATION_PASSWORD: ""
      VNC_LISTENING_PORT: "-1"
      WEB_FILE_MANAGER: "1"
      WEB_FILE_MANAGER_ALLOWED_PATHS: /storage
      WEB_TERMINAL: "0"
      KEEP_APP_RUNNING: "1"
    volumes:
      - ./config:/config
      - ./files:/storage
    ports:
      - 5801:5800
    shm_size: 256mb
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
