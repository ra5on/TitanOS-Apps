# SPDX-License-Identifier: AGPL-3.0-only
# Adapted from the official Immich v3.3.3 release composition by TitanOS,
# 2026-10-16: app-store metadata, linked secret, persistent bind mounts,
# health dependencies and explicit service addresses. See adjacent LICENSE.
# 2026-10-24: rolling application/cache tags and independently editable images;
# keep the PostgreSQL major version compatible with existing data.
# https://github.com/immich-app/immich/releases/tag/v3.3.3
x-titanos:
  icon: "https://raw.githubusercontent.com/immich-app/immich/main/design/immich-logo.svg"
  name: Immich
  main: immich-server
  category: photos
  description:
    de: Fotos und Videos sichern, durchsuchen und teilen. Mit Datenbank und Gesichtserkennung.
    en: Back up, search and share photos and videos. Includes the database and face recognition.
  tips:
    de: Jeder Dienst hat ein eigenes Image-Feld im Docker-App-Editor; dort den Tag auf eine gewünschte Version setzen. Aktueller Kanal ist für Server und ML release (Immich bietet kein latest), für Valkey latest. PostgreSQL verwendet einen kompatiblen 14-VectorChord-Tag; kein latest verfügbar. Mindestens 6 GB RAM und 2 CPU-Kerne für Immich einplanen. Beim ersten Öffnen ein Administratorkonto anlegen. Datenbank und Fotos liegen getrennt auf dem Daten-Volume; beide sichern. KI-Modelle werden beim ersten Einsatz geladen. CPU-Betrieb ist voreingestellt. Eine GPU für Videoverarbeitung gezielt beim Dienst immich-server auswählen und in Immich aktivieren. Für KI-Beschleunigung benötigt der ML-Dienst zusätzlich das passende offizielle CUDA-/OpenVINO-Abbild. Versionswechsel gemeinsam für Server und ML durchführen und vorher die Immich-Upgradehinweise lesen.
    en: Each service has its own image field in the Docker app editor; set its tag to the desired version there. The current channel is release for server and ML (Immich does not publish latest), and latest for Valkey. PostgreSQL uses a compatible 14-VectorChord tag; latest is unavailable. Allow at least 6 GB RAM and 2 CPU cores for Immich. Create an administrator account on first opening. Database and photos are stored separately on the data volume; back up both. AI models download on first use. CPU operation is the default. Select a GPU explicitly for immich-server and enable transcoding acceleration in Immich. ML acceleration additionally requires the matching official CUDA/OpenVINO image. Upgrade server and ML together after reading the Immich upgrade notes.
  variables:
    DB_PASSWORD:
      label: { de: Datenbankpasswort, en: Database password }
      secret: generate
      required: true
    POSTGRES_PASSWORD:
      from: DB_PASSWORD
  paths:
    /data:
      label: { de: Fotos und Videos, en: Photos and videos }
    /var/lib/postgresql/data:
      label: { de: PostgreSQL-Datenbank (lokales Volume), en: PostgreSQL database (local volume) }
    /cache:
      label: { de: KI-Modelle, en: AI models }
  ports:
    "2283":
      label: Immich
      webui: true
services:
  immich-server:
    labels:
      titanos.webui: "http://[host]:2283"
    image: ghcr.io/immich-app/immich-server:release
    restart: unless-stopped
    environment:
      TZ: ""
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
      DB_PASSWORD: ""
      REDIS_HOSTNAME: redis
      IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
    volumes:
      - ./library:/data
    ports:
      - "2283:2283"
    depends_on:
      database: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      disable: false
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    restart: unless-stopped
    environment:
      TZ: ""
    volumes:
      - ./model-cache:/cache
    healthcheck:
      disable: false
  redis:
    image: docker.io/valkey/valkey:latest
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - ./postgres:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      disable: false
