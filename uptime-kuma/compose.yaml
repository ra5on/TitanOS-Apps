x-titanos:
  icon: "https://raw.githubusercontent.com/louislam/uptime-kuma/master/public/icon.svg"
  name: Uptime Kuma
  category: network
  description:
    de: Überwacht Webseiten und Dienste und meldet Ausfälle.
    en: Watches websites and services and tells you when one is down.
  paths:
    /app/data:
      label: { de: Daten, en: Data }
  ports:
    "3001":
      label: WebUI
      webui: true

services:
  uptime-kuma:
    labels:
      titanos.webui: "http://[host]:3001"
    image: louislam/uptime-kuma:latest
    restart: unless-stopped
    environment:
      TZ: ""
    volumes:
      - "./data:/app/data"
    ports:
      - "3001:3001"
