x-titanos:
  icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/speaches.svg"
  name: Whisper (Speaches)
  main: whisper
  category: ai

  description:
    de: >-
      Spracherkennung mit Whisper und OpenAI-kompatibler
      Schnittstelle für andere Apps und Programme. Für den
      KI-Agenten von TitanOS und für Home Assistant sind die
      Sprachdienste von TitanOS (Einstellungen › Sprachdienste)
      der einfachere Weg; diese App wird dafür nicht gebraucht.
    en: >-
      Speech recognition with Whisper and an OpenAI-compatible
      API for other apps and programs. For the TitanOS KI-Agent
      and for Home Assistant the speech services of TitanOS
      (Settings › Speech services) are the easier way; this app
      is not needed for them.

  tips:
    de: >-
      Die Vorlage nutzt das CUDA-Image und reserviert eine
      NVIDIA-Grafikkarte; dafür muss das NVIDIA-Treiber-Plugin
      laufen. Ohne Grafikkarte das Image auf
      ghcr.io/speaches-ai/speaches:latest-cpu ändern und den
      deploy-Abschnitt entfernen. Das unter PRELOAD_MODELS
      genannte Modell wird beim ersten Start geladen (large-v3
      etwa 3 GB). Home Assistant kann diese App nicht nutzen
      (es erwartet das Wyoming-Protokoll der Sprachdienste).
      Wer sie trotzdem für den KI-Agenten nehmen will: unter
      Einstellungen › KI-Agent › Verbindung übernehmen.
      Die API hat keine Anmeldung; nicht öffentlich freigeben.
    en: >-
      The template uses the CUDA image and reserves an NVIDIA
      graphics card; the NVIDIA driver plugin must run. Without
      a graphics card change the image to
      ghcr.io/speaches-ai/speaches:latest-cpu and remove the
      deploy section. The model named in PRELOAD_MODELS is
      downloaded on the first start (large-v3 about 3 GB).
      Home Assistant cannot use this app (it expects the
      Wyoming protocol of the speech services). To use it for
      the KI-Agent all the same: take it over under Settings ›
      KI-Agent › Connection. The API has no login; do not
      expose it publicly.

  variables:
    PRELOAD_MODELS:
      label: { de: Modelle beim Start laden (JSON-Liste), en: Models loaded at start (JSON list) }

  paths:
    /home/ubuntu/.cache/huggingface/hub:
      label:
        de: Heruntergeladene Modelle
        en: Downloaded models

  ports:
    "8000":
      label: Whisper API
      webui: false

services:
  # The image runs as "ubuntu" (1000); Docker creates ./models as root, so
  # the models could not be downloaded. A fresh empty folder gets its owner.
  init:
    image: ghcr.io/speaches-ai/speaches:latest-cuda
    user: "0:0"
    restart: "no"
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - >-
        if [ "$$(stat -c %u /models)" = 0 ] && [ -z "$$(ls -A /models)" ];
        then chown 1000:1000 /models; fi
    volumes:
      - ./models:/models
    security_opt:
      - no-new-privileges=true

  whisper:
    depends_on:
      init:
        condition: service_completed_successfully
    image: ghcr.io/speaches-ai/speaches:latest-cuda
    restart: unless-stopped
    environment:
      TZ: "Europe/Berlin"
      PRELOAD_MODELS: '["Systran/faster-whisper-large-v3"]'
    ports:
      - "8010:8000"
    volumes:
      - ./models:/home/ubuntu/.cache/huggingface/hub
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
