x-titanos:
  icon: "https://raw.githubusercontent.com/dani-garcia/vaultwarden/main/resources/vaultwarden-icon.svg"
  name: Vaultwarden
  category: security
  description:
    de: Passwortmanager, kompatibel mit den Bitwarden-Apps.
    en: Password manager that works with the Bitwarden apps.
  tips:
    de: >-
      Die Registrierung ist nach der Installation offen, damit du dein
      Konto anlegen kannst. Stelle „Registrierung offen“ danach auf false
      (App bearbeiten), sonst kann sich jeder ein Konto anlegen, der die
      Adresse erreicht. Weitere Konten lädst du über die Verwaltungsseite
      /admin mit dem Admin-Token ein.
    en: >-
      Sign-ups are open after the installation so that you can create
      your account. Set "Sign-ups allowed" to false afterwards (edit the
      app), or anyone who reaches the address can create an account.
      Invite further accounts on the admin page /admin with the admin
      token.
  variables:
    DOMAIN:
      label: { de: Öffentliche Adresse, en: Public address }
      help:
        de: Die Apps brauchen HTTPS, zum Beispiel über einen Reverse-Proxy. Trage hier die Adresse ein, unter der Vaultwarden erreichbar ist.
        en: The apps need HTTPS, for example through a reverse proxy. Enter the address Vaultwarden is reachable at.
      placeholder: https://vault.example.org
    ADMIN_TOKEN:
      label: { de: Admin-Token, en: Admin token }
      help:
        de: Passwort für die Verwaltungsseite unter /admin.
        en: Password for the admin page at /admin.
      secret: generate
    SIGNUPS_ALLOWED:
      label: { de: Registrierung offen, en: Sign-ups allowed }
      help:
        de: Nach dem Anlegen deines Kontos am besten auf false stellen.
        en: Best set to false once your account exists.
  paths:
    /data:
      label: { de: Daten, en: Data }
  ports:
    "80":
      label: WebUI
      webui: true

services:
  vaultwarden:
    labels:
      titanos.webui: "http://[host]:8222"
    image: vaultwarden/server:latest
    restart: unless-stopped
    environment:
      DOMAIN: ""
      ADMIN_TOKEN: ""
      SIGNUPS_ALLOWED: "true"
      TZ: ""
    volumes:
      - "./data:/data"
    ports:
      - "8222:80"
