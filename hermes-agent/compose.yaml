
x-titanos:
  icon: "https://raw.githubusercontent.com/NousResearch/hermes-agent/main/apps/bootstrap-installer/src-tauri/icons/128x128.png"
  name: Hermes Agent
  main: hermes
  category: productivity

  description:
    de: >-
      Autonomer KI-Agent von Nous Research mit
      Web-Dashboard, persistentem Gedächtnis,
      Skills, Tools, Automatisierungen und
      Unterstützung für lokale und externe
      KI-Modelle.
    en: >-
      Autonomous AI agent by Nous Research
      with web dashboard, persistent memory,
      skills, tools, automations and support
      for local and cloud AI models.

  tips:
    de: >-
      Beim Installieren einen Benutzernamen und
      ein sicheres Passwort festlegen.
      TitanOS generiert den Sitzungsschlüssel
      und API-Schlüssel automatisch.
      Das Dashboard ist über Port 9119 erreichbar.
      Die Agent-API auf Port 8642 ist nur
      vom Docker-Host erreichbar.
      KI-Modelle und externe Dienste können
      anschließend über das Hermes-Dashboard
      oder hermes setup eingerichtet werden.
      Für lokales Ollama den Custom Endpoint
      http://host.docker.internal:11434/v1
      verwenden, sofern Ollama über den
      Docker-Host erreichbar ist.
      Sämtliche Agent-Daten, Konfigurationen,
      Erinnerungen, Skills und Gespräche
      bleiben dauerhaft gespeichert.
      Es wird keine GPU benötigt, solange
      die Modelle extern oder in Ollama laufen.
      Das Dashboard nur in vertrauenswürdigen
      Netzwerken oder über VPN betreiben.
    en: >-
      Set a username and secure password during
      installation. TitanOS generates the session
      signing key and API key automatically.
      The dashboard is available on port 9119.
      The agent API on port 8642 is only
      accessible from the Docker host.
      Configure models and external providers
      through the Hermes dashboard or setup.
      Local Ollama can be configured through
      a custom OpenAI-compatible endpoint.
      All configurations, skills, memories,
      sessions and conversations are persistent.
      No GPU is required for remote inference.
      Only expose the dashboard on trusted
      networks or behind a VPN.

  # ============================================
  # TITANOS VARIABLEN
  # ============================================

  variables:

    # ------------------------------------------
    # DASHBOARD AUTHENTIFIZIERUNG
    # ------------------------------------------

    HERMES_DASHBOARD_BASIC_AUTH_USERNAME:
      label:
        de: Dashboard-Benutzername
        en: Dashboard username
      required: true

    HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:
      label:
        de: Dashboard-Passwort
        en: Dashboard password
      secret: true
      required: true

    HERMES_DASHBOARD_BASIC_AUTH_SECRET:
      label:
        de: Sitzungsschlüssel
        en: Session signing secret
      secret: generate
      required: true

    # ------------------------------------------
    # AGENT API
    # ------------------------------------------

    API_SERVER_KEY:
      label:
        de: Agent API-Schlüssel
        en: Agent API key
      secret: generate
      required: true

    # ------------------------------------------
    # ERWEITERTE EINSTELLUNGEN
    # ------------------------------------------

    HERMES_DASHBOARD_BASIC_AUTH_TTL_SECONDS:
      label:
        de: Anmeldesitzung in Sekunden
        en: Login session lifetime in seconds

    API_SERVER_CORS_ORIGINS:
      label:
        de: Erlaubte API-Web-Ursprünge
        en: Allowed API origins

    API_SERVER_MODEL_NAME:
      label:
        de: Angezeigter API-Modellname
        en: Advertised API model name

    TERMINAL_ENV:
      label:
        de: Terminal-Backend (local/docker/ssh)
        en: Terminal backend (local/docker/ssh)

    TERMINAL_TIMEOUT:
      label:
        de: Terminal-Zeitlimit in Sekunden
        en: Terminal timeout in seconds

  # ============================================
  # PERSISTENTE DATEN
  # ============================================

  paths:
    /opt/data:
      label:
        de: Konfiguration, Skills, Erinnerungen und Chats
        en: Configuration, skills, memories and chats

  # ============================================
  # PORTS
  # ============================================

  ports:
    "9119":
      label: Hermes Dashboard
      webui: true

    "8642":
      label: Hermes Agent API
      webui: false


# ==============================================
# SERVICES
# ==============================================

services:

  hermes:
    labels:
      titanos.webui: "http://[host]:9119"
    image: nousresearch/hermes-agent:${HERMES_AGENT_HERMES_IMAGE_TAG:-latest}
    restart: unless-stopped

    # ==========================================
    # STARTBEFEHL
    # ==========================================

    command:
      - gateway
      - run

    # ==========================================
    # UMGEBUNGSVARIABLEN
    # ==========================================

    environment:

      # ----------------------------------------
      # SYSTEM
      # ----------------------------------------

      TZ: "Europe/Berlin"

      # ----------------------------------------
      # WEB-DASHBOARD
      # ----------------------------------------

      # Dashboard aktivieren
      HERMES_DASHBOARD: "1"

      # Im Container auf allen Interfaces lauschen
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"

      # ----------------------------------------
      # DASHBOARD BENUTZERANMELDUNG
      # ----------------------------------------

      # Wird bei der Installation abgefragt
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ""

      # Wird bei der Installation abgefragt
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ""

      # Wird von TitanOS automatisch generiert
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ""

      # 24 Stunden Anmeldesitzung
      HERMES_DASHBOARD_BASIC_AUTH_TTL_SECONDS: "86400"

      # ----------------------------------------
      # AGENT API
      # ----------------------------------------

      # OpenAI-kompatible API aktivieren
      API_SERVER_ENABLED: "true"

      # Auf allen Container-Interfaces lauschen
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"

      # Wird von TitanOS automatisch generiert
      API_SERVER_KEY: ""

      # Keine zusätzlichen Browser-Ursprünge
      API_SERVER_CORS_ORIGINS: ""

      # Angezeigter Modellname
      API_SERVER_MODEL_NAME: "hermes-agent"

      # ----------------------------------------
      # TERMINAL
      # ----------------------------------------

      # local = Befehle im Hermes-Container
      # docker = zusätzlicher Sandbox-Container
      # ssh = entfernter SSH-Server
      TERMINAL_ENV: "local"

      # Maximale Befehlsdauer in Sekunden
      TERMINAL_TIMEOUT: "180"

    # ==========================================
    # PORTFREIGABEN
    # ==========================================

    ports:

      # Dashboard im lokalen Netzwerk
      - "9119:9119"

      # API nur auf dem Docker-Host
      - "127.0.0.1:8642:8642"

    # ==========================================
    # PERSISTENTE DATEN
    # ==========================================

    volumes:
      - ./hermes:/opt/data

    # ==========================================
    # NETZWERK
    # ==========================================

    # Erlaubt die Verbindung zu Ollama,
    # vLLM und anderen Diensten des Hosts.

    extra_hosts:
      - "host.docker.internal:host-gateway"

    # ==========================================
    # SICHERHEIT
    # ==========================================

    # Kein privilegierter Container.
    # Kein Docker-Socket eingebunden.
    # Keine Host-Dateisystemfreigabe außer
    # dem persistenten Hermes-Datenverzeichnis.

    security_opt:
      - no-new-privileges:true

    # ==========================================
    # RESSOURCEN
    # ==========================================

    # Bei Browser-Automatisierungen sind
    # mindestens 2 GB RAM sinnvoll.
    # Hier keine feste Speicherbegrenzung.

    # ==========================================
    # BEENDEN
    # ==========================================

    stop_grace_period: 30s

    # ==========================================
    # PROTOKOLLIERUNG
    # ==========================================

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
