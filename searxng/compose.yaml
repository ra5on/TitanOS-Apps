x-titanos:
  name: SearXNG
  main: searxng
  category: network
  description:
    de: Eigene Metasuchmaschine – fragt viele Suchdienste ab, ohne Konto und ohne Verlauf. Der KI-Agent von TitanOS kann sie als Websuche nutzen.
    en: A metasearch engine of your own – asks many search services, without an account or history. The TitanOS AI agent can use it as its web search.
  tips:
    de: Nach der Installation die Adresse (http://<NAS>:8888) unter Einstellungen › KI-Agent ›
      Verbindung und Modelle › „Eigene Websuche (SearXNG)“ eintragen; der Agent sucht dann hier statt
      über die Seite von DuckDuckGo. Die Vorlage schaltet dafür beim ersten Start die JSON-Ausgabe ein
      und legt einen eigenen geheimen Schlüssel an (config/settings.yml auf dem Daten-Volume); eine
      vorhandene settings.yml wird nicht angefasst. Suchdienste, Sprache und Aussehen stellst du in
      dieser Datei oder in der Weboberfläche ein. SearXNG hat keine Anmeldung, deshalb nur im
      Heimnetz oder über Tailscale erreichbar lassen und keine Router-Portfreigabe einrichten.
    en: After installing, enter the address (http://<NAS>:8888) under Settings › AI agent › Connection
      and models › "Own web search (SearXNG)"; the agent then searches here instead of through
      DuckDuckGo's page. For that the template switches the JSON output on at the first start and
      creates a secret key of its own (config/settings.yml on the data volume); an existing
      settings.yml is left alone. Search services, language and look are set in that file or in the
      web interface. SearXNG has no sign-in, so keep it reachable only in the home network or over
      Tailscale and do not forward a router port.
  paths:
    /etc/searxng:
      label:
        de: Einstellungen (settings.yml)
        en: Settings (settings.yml)
    /var/cache/searxng:
      label:
        de: Zwischenspeicher
        en: Cache
  ports:
    "8080":
      label: WebUI
      webui: true
  icon: https://raw.githubusercontent.com/searxng/searxng/master/client/simple/src/brand/searxng-wordmark.svg
services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    labels:
      titanos.webui: http://[host]:8888
    ports:
      - 8888:8080
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # The first start writes settings with the JSON output switched on (the
    # TitanOS agent asks /search?format=json) and a secret key of its own;
    # afterwards the image's own start script runs unchanged.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -f /etc/searxng/settings.yml ]; then
          key="$$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          printf 'use_default_settings: true\nserver:\n  secret_key: "%s"\n  limiter: false\n  image_proxy: false\nsearch:\n  formats:\n    - html\n    - json\n' "$$key" > /etc/searxng/settings.yml
        fi
        exec /usr/local/searxng/entrypoint.sh
    volumes:
      - ./config:/etc/searxng
      - ./cache:/var/cache/searxng
