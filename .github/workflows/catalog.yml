name: Catalog checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate Compose templates
        run: |
          for file in */compose.yaml; do
            docker compose -f "$file" config --quiet
          done
      - name: Check Frigate image availability
        run: docker manifest inspect ghcr.io/blakeblackshear/frigate:stable > /dev/null
