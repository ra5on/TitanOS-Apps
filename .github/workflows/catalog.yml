name: Catalog checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Read unchanged released TitanOS form code
        uses: actions/checkout@v7
        with:
          repository: ra5on/TitanOS
          ref: v0.21.0
          path: .titanos
          sparse-checkout: web/src/lib
      - name: Verify current channels and direct per-service tag editing
        env:
          TITANOS_DIR: ${{ github.workspace }}/.titanos
        run: |
          npm install --prefix /tmp/catalog-yaml --ignore-scripts yaml@2.9.1
          ln -s /tmp/catalog-yaml/node_modules .titanos/web/node_modules
          node scripts/catalog-images.test.mjs
      - name: Validate Compose templates
        run: |
          for file in */compose.yaml; do
            docker compose -f "$file" config --quiet
          done
      - name: Check Frigate image availability
        run: docker manifest inspect ghcr.io/blakeblackshear/frigate:stable > /dev/null
  ui:
    name: Catalog tags in TitanOS WebUI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ra5on/TitanOS
          ref: v0.21.0
          path: .titanos
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build unchanged released TitanOS UI and load browser client
        run: |
          npm --prefix .titanos/web ci
          npm --prefix .titanos/web run build
          npm install --prefix /tmp/catalog-browser --ignore-scripts playwright
          google-chrome --version
      - name: Test all catalog images, stacks and mobile tag inputs
        env:
          TITANOS_DIR: ${{ github.workspace }}/.titanos
          PLAYWRIGHT_PATH: /tmp/catalog-browser/node_modules/playwright/index.mjs
          BROWSER_EXECUTABLE: /usr/bin/google-chrome
          UI_OUTPUT: /tmp/catalog-ui
        run: |
          npm --prefix .titanos/web run preview -- --host 127.0.0.1 --port 5291 --strictPort > /tmp/catalog-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5291/apps > /dev/null; then break; fi
            sleep 1
          done
          node scripts/catalog-ui-smoke.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: catalog-tags-ui
          path: |
            /tmp/catalog-ui/
            /tmp/catalog-preview.log
