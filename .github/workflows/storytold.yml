name: Storytold web images
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  pull_request:
    paths: ['scripts/**', 'packaging/**', '.github/workflows/storytold.yml']
  push:
    branches: [main]
    paths: ['scripts/storytold.py', 'scripts/web-smoke.mjs', 'packaging/**', '.github/workflows/storytold.yml']
permissions:
  contents: read
env:
  # Same version as the local TitanOS dev setup; bump deliberately.
  PLAYWRIGHT_VERSION: 1.56.1
concurrency:
  group: storytold-images
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      changed: ${{ steps.discover.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          matrix=$(python3 scripts/storytold.py discover)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "changed=$(echo "$matrix" | jq '.include | length > 0')" >> "$GITHUB_OUTPUT"
  build:
    needs: discover
    if: needs.discover.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    # Builds and tests code that a pull request may have changed: this job
    # can read only. Publishing is a job of its own (publish) that never
    # runs for a pull request.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Fetch verified web release and original notices
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ matrix.app }}
          RECORD: ${{ matrix.record }}
        run: python3 scripts/storytold.py prepare --app "$APP" --record "$RECORD"
      - name: Build and test
        env:
          APP: ${{ matrix.app }}
        run: |
          docker build --label "org.opencontainers.image.source=https://github.com/ra5on/TitanOS-Apps" -t "test-$APP" image-context
          docker run -d --name web-test --read-only --tmpfs /tmp:rw,size=32m,mode=1777 --cap-drop ALL --security-opt no-new-privileges=true -p 127.0.0.1:8099:8080 "test-$APP"
          npm install --prefix /tmp/browser "playwright@$PLAYWRIGHT_VERSION"
          /tmp/browser/node_modules/.bin/playwright install --with-deps chromium
          PLAYWRIGHT_PATH=/tmp/browser/node_modules/playwright/index.mjs node scripts/web-smoke.mjs http://127.0.0.1:8099 "$APP"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-${{ matrix.app }}
          path: '*-smoke.png'
      - name: Keep the tested image for publishing
        if: github.event_name != 'pull_request'
        env:
          APP: ${{ matrix.app }}
        run: docker save "test-$APP" | zstd -q -T0 -o "image-$APP.tar.zst"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: image-${{ matrix.app }}
          path: image-${{ matrix.app }}.tar.zst
          retention-days: 1
          compression-level: 0
  publish:
    # Pushes exactly the image the build job tested. One failed app must not
    # hold back the others: a leg without a tested image ends quietly.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.discover.outputs.changed == 'true' }}
    needs: [discover, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: image
        continue-on-error: true
        with:
          name: image-${{ matrix.app }}
      - name: Publish checked images
        if: steps.image.outcome == 'success'
        env:
          APP: ${{ matrix.app }}
          RECORD: ${{ matrix.record }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          version=$(echo "$RECORD" | jq -r .tag)
          zstd -dc "image-$APP.tar.zst" | docker load
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          image="ghcr.io/ra5on/titanos-$APP"
          docker tag "test-$APP" "$image:$version"
          docker tag "test-$APP" "$image:latest"
          docker push "$image:$version"
          docker push "$image:latest"
          python3 scripts/storytold.py catalog --app "$APP" --record "$RECORD"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.image.outcome == 'success'
        with:
          name: catalog-${{ matrix.app }}
          include-hidden-files: true
          path: |
            ${{ matrix.app }}/compose.yaml
            ${{ matrix.app }}/release.json
  catalog:
    # One failed app must not hold back the others (and make them rebuild
    # forever): only legs that passed their checks uploaded a catalog artifact.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.publish.result != 'skipped' }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: catalog-*
          path: /tmp/catalog
      - name: Update only successfully tested catalog entries
        run: |
          shopt -s nullglob
          for dir in /tmp/catalog/catalog-*; do
            app=${dir##*/catalog-}
            mkdir -p "$app"
            cp "$dir/compose.yaml" "$dir/release.json" "$app/"
          done
          python3 scripts/storytold.py icons
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*craft/compose.yaml' '*craft/release.json' icons.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update checked Storytold web releases'
          git pull --rebase origin main
          git push origin HEAD:main
