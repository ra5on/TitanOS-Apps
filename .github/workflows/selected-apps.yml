name: Selected app smoke
on:
  workflow_dispatch:
  push:
    paths: ['joplin-server/**', 'zigbee2mqtt/**', 'esphome/**', 'n8n/**', 'mealie/**', 'grocy/**', 'scripts/selected-apps-smoke.mjs', '.github/workflows/selected-apps.yml']
  pull_request:
    paths: ['joplin-server/**', 'zigbee2mqtt/**', 'esphome/**', 'n8n/**', 'mealie/**', 'grocy/**', 'scripts/selected-apps-smoke.mjs', '.github/workflows/selected-apps.yml']
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        app: [joplin-server, zigbee2mqtt, esphome, n8n, mealie, grocy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install browser client
        run: |
          npm install --prefix /tmp/browser playwright
          google-chrome --version
      - name: Test isolated app
        env:
          APP: ${{ matrix.app }}
          PLAYWRIGHT_PATH: /tmp/browser/node_modules/playwright/index.mjs
        run: node scripts/selected-apps-smoke.mjs "$APP"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: selected-${{ matrix.app }}
          path: '*-selected-smoke.png'
