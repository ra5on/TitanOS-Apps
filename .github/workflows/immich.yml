name: Immich rolling stack smoke
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths: ['immich/**', 'scripts/immich-smoke.mjs', '.github/workflows/immich.yml']
  pull_request:
    paths: ['immich/**', 'scripts/immich-smoke.mjs', '.github/workflows/immich.yml']
permissions:
  contents: read
  packages: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Authenticate GHCR image downloads
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Test versions, photo processing, ML search and persistence of the full rolling stack
        run: node scripts/immich-smoke.mjs
