name: Notes MQTT and transfer smoke
on:
  workflow_dispatch:
  push:
    paths: ['trilium/**', 'mosquitto/**', 'pairdrop/**', 'scripts/notes-mqtt-transfer-smoke.mjs', '.github/workflows/trilium-mosquitto-pairdrop.yml']
  pull_request:
    paths: ['trilium/**', 'mosquitto/**', 'pairdrop/**', 'scripts/notes-mqtt-transfer-smoke.mjs', '.github/workflows/trilium-mosquitto-pairdrop.yml']
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        app: [trilium, mosquitto, pairdrop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install browser test client
        if: matrix.app != 'mosquitto'
        run: |
          npm install --prefix /tmp/browser playwright
          google-chrome --version
      - name: Test isolated app
        env:
          PLAYWRIGHT_PATH: /tmp/browser/node_modules/playwright/index.mjs
        run: node scripts/notes-mqtt-transfer-smoke.mjs '${{ matrix.app }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.app != 'mosquitto'
        with:
          name: notes-transfer-${{ matrix.app }}
          path: '*-catalog-smoke.png'
