name: Frigate startup smoke
on:
  workflow_dispatch:
  push:
    paths: ['frigate/**', 'scripts/frigate-smoke.mjs', '.github/workflows/frigate.yml']
  pull_request:
    paths: ['frigate/**', 'scripts/frigate-smoke.mjs', '.github/workflows/frigate.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test log permissions, HTTPS, accounts and clean shutdown
        run: node scripts/frigate-smoke.mjs
