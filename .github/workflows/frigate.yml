name: Frigate startup smoke
on:
  workflow_dispatch:
  push:
    paths: ['frigate/**', 'scripts/frigate-smoke.mjs', '.github/workflows/frigate.yml']
  pull_request:
    paths: ['frigate/**', 'scripts/frigate-smoke.mjs', '.github/workflows/frigate.yml']
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        config: [fresh, seeded]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install browser test client
        run: |
          npm install --prefix /tmp/browser playwright
          google-chrome --version
      - name: Test all ports, browser login, accounts and clean shutdown
        env:
          FRIGATE_CONFIG_MODE: ${{ matrix.config }}
          PLAYWRIGHT_PATH: /tmp/browser/node_modules/playwright/index.mjs
        run: node scripts/frigate-smoke.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frigate-${{ matrix.config }}
          path: 'frigate-*-smoke.png' 
