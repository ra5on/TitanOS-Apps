name: Games browser and chat smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['minecraft-java/**', 'minecraft-bedrock/**', 'valheim/**', 'terraria/**', 'satisfactory/**', 'palworld/**', 'firefox/**', 'matrix-element/**', 'mattermost/**', 'scripts/games-chat-smoke.mjs', '.github/workflows/games-chat.yml']
  pull_request:
    paths: ['minecraft-java/**', 'minecraft-bedrock/**', 'valheim/**', 'terraria/**', 'satisfactory/**', 'palworld/**', 'firefox/**', 'matrix-element/**', 'mattermost/**', 'scripts/games-chat-smoke.mjs', '.github/workflows/games-chat.yml']
concurrency:
  group: games-chat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        app: [minecraft-java, minecraft-bedrock, valheim, terraria, satisfactory, palworld, firefox, matrix-element, mattermost]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install browser test client
        if: matrix.app == 'firefox' || matrix.app == 'matrix-element'
        run: |
          npm install --prefix /tmp/browser playwright
          google-chrome --version
      - name: Allow self-signed HTTPS in isolated test client
        run: echo 'NODE_TLS_REJECT_UNAUTHORIZED=0' >> "$GITHUB_ENV"
      - name: Test isolated app
        env:
          PLAYWRIGHT_PATH: /tmp/browser/node_modules/playwright/index.mjs
        run: node scripts/games-chat-smoke.mjs '${{ matrix.app }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && (matrix.app == 'firefox' || matrix.app == 'matrix-element')
        with:
          name: games-chat-${{ matrix.app }}
          path: '*-catalog-smoke.png'
