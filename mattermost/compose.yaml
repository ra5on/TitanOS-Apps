x-titanos:
  name: Mattermost
  main: mattermost
  category: social
  description:
    de: Eigener Teamchat mit Kanälen, persönlichen Konten und Dateiaustausch.
    en: Your own team chat with channels, personal accounts and file sharing.
  tips:
    de: Mattermost Team Edition mit eigener PostgreSQL-Datenbank. Beim ersten Öffnen das erste
      Administratorkonto einrichten und danach weitere Personen einladen. Die TitanOS-Anmeldung wird
      nicht übernommen. SITEURL muss exakt zur erreichbaren Adresse und zum gewählten NAS-Port passen.
      Für Fernzugriff HTTPS am Reverse-Proxy separat einrichten. Chat, Dateien, Einstellungen und
      Datenbank liegen auf dem Daten-Volume. E-Mail-Versand muss bei Bedarf über SMTP eingerichtet
      werden. Diese Vorlage richtet keine Telefonie-/Video-Infrastruktur ein. Die
      Mattermost-Verzeichnisse sind gemeinsame Docker-Volumes im ausgewählten Docker-Datenverzeichnis;
      zusammen mit dem PostgreSQL-Ordner sichern.
    en: Mattermost Team Edition with its own PostgreSQL database. Create the first administrator account on
      first opening, then invite other people. TitanOS authentication is separate. SITEURL must exactly
      match the reachable address and selected NAS port. Configure HTTPS separately at a reverse proxy
      for remote access. Chat, files, configuration and database reside on the data volume. Configure
      SMTP separately if needed. This template does not set up voice/video infrastructure. Mattermost
      directories use shared Docker volumes in the selected Docker data directory; back them up together
      with the PostgreSQL directory.
  variables:
    MM_SERVICESETTINGS_SITEURL:
      label:
        de: Erreichbare Mattermost-Adresse
        en: Reachable Mattermost URL
      required: true
      placeholder: http://nas.example:8065
    MATTERMOST_DATABASE_PASSWORD:
      label:
        de: Internes Datenbankpasswort
        en: Internal database password
      secret: generate
      required: true
    POSTGRES_PASSWORD:
      from: MATTERMOST_DATABASE_PASSWORD
    MM_DATABASE_PASSWORD:
      from: MATTERMOST_DATABASE_PASSWORD
    TZ:
      label:
        de: Zeitzone
        en: Timezone
      fill: timezone
  paths:
    /var/lib/postgresql/data:
      label:
        de: Datenbank
        en: Database
  ports:
    "8065":
      label: Mattermost WebUI
      webui: true
  icon: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/svg/mattermost.svg
services:
  mattermost:
    image: mattermost/mattermost-team-edition:12.0.1
    restart: unless-stopped
    labels:
      titanos.webui: http://[host]:8065
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |-
        encoded=$$(printf %s "$$MM_DATABASE_PASSWORD" | od -An -v -tx1 | tr -d '[:space:]' | sed 's/../%&/g')
        export MM_SQLSETTINGS_DATASOURCE="postgres://mattermost:$$encoded@db:5432/mattermost?sslmode=disable&connect_timeout=10"
        exec /mattermost/bin/mattermost
    environment:
      MM_DATABASE_PASSWORD: ${MATTERMOST_DATABASE_PASSWORD:-}
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SERVICESETTINGS_SITEURL: ""
      MM_SERVICESETTINGS_LISTENADDRESS: :8065
      MM_LOGSETTINGS_ENABLECONSOLE: "true"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "false"
      MM_BLEVESETTINGS_INDEXDIR: /mattermost/bleve-indexes
      TZ: ""
    ports:
      - 8065:8065
    volumes:
      - mattermost-config:/mattermost/config
      - mattermost-data:/mattermost/data
      - mattermost-logs:/mattermost/logs
      - mattermost-plugins:/mattermost/plugins
      - mattermost-client-plugins:/mattermost/client/plugins
      - mattermost-bleve-indexes:/mattermost/bleve-indexes
    stop_grace_period: 60s
    logging: &a1
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mattermost
      POSTGRES_DB: mattermost
      POSTGRES_PASSWORD: ${MATTERMOST_DATABASE_PASSWORD:-}
      MATTERMOST_DATABASE_PASSWORD: ""
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U mattermost -d mattermost
      interval: 5s
      timeout: 5s
      retries: 30
    stop_grace_period: 60s
    logging: *a1
  init:
    image: mattermost/mattermost-team-edition:12.0.1
    user: 0:0
    restart: no
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |-
        chown 2000:2000 /mattermost/config; chmod 0750 /mattermost/config
        chown 2000:2000 /mattermost/data; chmod 0750 /mattermost/data
        chown 2000:2000 /mattermost/logs; chmod 0750 /mattermost/logs
        chown 2000:2000 /mattermost/plugins; chmod 0750 /mattermost/plugins
        chown 2000:2000 /mattermost/client/plugins; chmod 0750 /mattermost/client/plugins
        chown 2000:2000 /mattermost/bleve-indexes; chmod 0750 /mattermost/bleve-indexes
    volumes:
      - mattermost-config:/mattermost/config
      - mattermost-data:/mattermost/data
      - mattermost-logs:/mattermost/logs
      - mattermost-plugins:/mattermost/plugins
      - mattermost-client-plugins:/mattermost/client/plugins
      - mattermost-bleve-indexes:/mattermost/bleve-indexes
    logging: *a1
volumes:
  mattermost-config: {}
  mattermost-data: {}
  mattermost-logs: {}
  mattermost-plugins: {}
  mattermost-client-plugins: {}
  mattermost-bleve-indexes: {}
